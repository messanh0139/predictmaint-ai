[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["notebooks", "mlruns", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # Ligne trop longue
    "E402",  # Import après code (normal pour sys.path.insert)
    "F401",  # Import non utilisé
    "F541",  # f-string sans placeholder
    "F811",  # Redéfinition de variable
]
