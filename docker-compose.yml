services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      MODEL_PATH: /app/models/model.joblib
      MODEL_METADATA_PATH: /app/models/model_metadata.json
      PREDICTION_LOG_PATH: /tmp/predictions.jsonl
      FEEDBACK_LOG_PATH: /tmp/feedback.jsonl
    volumes:
      - prediction_logs:/tmp
      - ./data:/app/data
      - ./models:/app/models

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      API_URL: http://api:8080
      DEMO_DATA_PATH: /app/data/raw/test_FD001.txt
      MODEL_METADATA_PATH: /app/models/model_metadata.json
      TEST_METRICS_PATH: /app/models/test_metrics.json
      PROMETHEUS_URL: http://localhost:9090
      GRAFANA_URL: http://localhost:${GRAFANA_PORT:-3001}
      MLFLOW_URL: http://localhost:${MLFLOW_PORT:-5000}
      API_DOCS_URL: http://localhost:${API_PORT:-8081}/docs
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_healthy

  trainer:
    profiles: ["training"]
    build:
      context: .
      dockerfile: Dockerfile.train
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  prediction_logs:
  mlflow_data:
