global:
  scrape_interval: 15s
scrape_configs:
  - job_name: predictmaint-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
