name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -c constraints-model.txt
      - name: Static checks
        run: ruff check pipelines/3_inference_ihm/api src infrastructure/tests infrastructure/scripts
      - name: Unit and leakage tests
        run: pytest --cov=src --cov=pipelines.3_inference_ihm.api --cov-report=term-missing infrastructure/tests/
      - name: Rebuild data partitions
        run: python -m src.data.prepare
      - name: Fit feature selection on TRAIN only
        run: python -m src.features.select_features
      - name: Train baseline candidates
        run: python -m src.models.train
      - name: Validation quality gate
        run: python -m src.models.quality_gate
      - name: Register validated artifact
        run: python -m src.models.register
      - name: Verify production artifact contract
        run: |
          test -s storage/models/model.joblib
          test -s storage/models/model_metadata.json
          test -s storage/models/leaderboard.csv
